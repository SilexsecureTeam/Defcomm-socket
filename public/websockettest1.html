<!DOCTYPE html>
<html>
<head>
    <title>Laravel WebSocket Chat Test</title>
    <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
</head>
<body>
    <h2>Listening to private-chat.2</h2>
    <pre id="log"></pre>

<script>
    Pusher.logToConsole = true;

    const pusher = new Pusher("l4ewjdxj5hilgin4smsv", {
        wsHost: 'backend.defcomm.ng', // No https:// here
        forceTLS: true,
        disableStats: true,
        encrypted: true,
        enabledTransports: ['wss'], // only use secure transport
        authEndpoint: "https://backend.defcomm.ng/api/broadcasting/auth",
        auth: {
            headers: {
                Authorization: "Bearer 4|K2RUS2zRe22uxOQh8e6gLXiJ6YlEYqdf6Ju4339mab476af6"
            }
        }
    });

    const privateChannel = pusher.subscribe("private-chat.31");

    privateChannel.bind("private.message.sent", function (data) {
        console.log("Private:", data.message);
        document.getElementById('log').textContent +=
            'Received: ' + JSON.stringify(data) + '\n';
    });

    privateChannel.bind('pusher:subscription_error', function(status) {
        console.error('Subscription error:', status);
    });
</script>
</body>
</html>
