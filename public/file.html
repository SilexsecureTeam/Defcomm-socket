<!DOCTYPE html>
<html>
<head>
    <title>Embed PDF with Watermark</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        #pdf-container {
            width: 100%;
            overflow: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .pdf-page {
            display: block;
            margin: 10px auto;
            border: 1px solid #000;
            padding: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            position: relative;
        }
    </style>
</head>
<body>
    <div id="pdf-container"></div>

    <script>
        const url = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";

        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        const loadingTask = pdfjsLib.getDocument({
            url: url,
            withCredentials: false
        });

        loadingTask.promise.then(function(pdf) {
            const pdfContainer = document.getElementById('pdf-container');

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(function(page) {
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    page.render(renderContext).promise.then(function() {
                        pdfContainer.appendChild(canvas);

                        // Watermark text
                        const watermarkText = "View by John Doe"; // Static for demo
                        context.font = "30px Arial";
                        context.fillStyle = "#C1C1C0";
                        context.globalAlpha = 0.2;
                        context.textAlign = "center";
                        context.textBaseline = "middle";

                        const gridSpacingX = 200;
                        const gridSpacingY = 150;

                        for (let x = 0; x < canvas.width; x += gridSpacingX) {
                            for (let y = 0; y < canvas.height; y += gridSpacingY) {
                                context.fillText(watermarkText, x, y);
                            }
                        }
                    });
                });
            }
        }).catch(function(error) {
            console.error("Error loading PDF:", error);
        });
    </script>
</body>
</html>
